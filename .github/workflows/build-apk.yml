name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show build environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          gradle --version

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/yui-novel-v1.1.0.apk
          ls -lh out/yui-novel-v1.1.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yui-novel-apk
          path: out/yui-novel-v1.1.0.apk
          if-no-files-found: error

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: yuiの轻小说 APK（自动构建）
          body: |
            直接下载下方 APK 安装到 Android 手机即可（Android 8.0 及以上）。

            这是调试签名版本，适合个人安装体验；首次安装需在系统中允许「安装未知来源应用」。
          files: out/yui-novel-v1.1.0.apk
          overwrite_files: true
          prerelease: true
