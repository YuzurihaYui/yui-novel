  <title>第 1 话 借书的人</title>
  <style>
    body { margin: 0; padding: 26px 20px 60px; background: #0d1015; color: #d8d4cd; font-family: Georgia, "Songti SC", serif; line-height: 2; font-size: 17px; }

  </style>

<body>
  <h1>第 1 话 借书的人</h1>
  <div id="content">
    <p>闭馆铃响过之后，图书馆里只剩下两个人。我，和那个总在最后一排看书的女孩。</p>
    <p>她借的书很奇怪，封面永远是空白的。借书卡上只有一个名字，写了三遍。</p>
    <p>“这本书讲什么？”我问。</p>
    <p>她把书推过来，书页上浮出一行字：讲一个图书管理员，在闭馆后遇见了一个不该存在的人。</p>
    <p>我抬头，她已经不在座位上了。桌上只剩一盏没有点亮的灯。</p>
  </div>
</body>
