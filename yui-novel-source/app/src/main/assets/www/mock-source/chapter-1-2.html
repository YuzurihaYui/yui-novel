  <title>第 2 话 还书的人</title>
  <style>
    body { margin: 0; padding: 26px 20px 60px; background: #0d1015; color: #d8d4cd; font-family: Georgia, "Songti SC", serif; line-height: 2; font-size: 17px; }
    p { margin: 0 0 1.1em; text-indent: 2em; }
    h1 { font-size: 20px; color: #e9e5de; }
  </style>
</head>
<body>
  <h1>第 2 话 还书的人</h1>
  <div id="content">
    <p>第二天，她还了一本书。书脊上写着我的名字。</p>
    <p>我翻开，里面记录着我昨天说过的每一句话，包括那句没有说出口的。</p>
    <p>“你到底是什么？”我问。</p>
    <p>她指了指借书卡上的名字。那三个字，和我小时候写在课本上的笔迹一模一样。</p>
    <p>那天夜里，闭馆铃第一次响了两遍。</p>
  </div>
</body>
</html>
