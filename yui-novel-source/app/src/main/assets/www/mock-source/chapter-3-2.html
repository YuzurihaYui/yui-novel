  <title>第 2 话 夜班交接</title>
  <style>
    body { margin: 0; padding: 26px 20px 60px; background: #0d1015; color: #d8d4cd; font-family: Georgia, "Songti SC", serif; line-height: 2; font-size: 17px; }

  </style>

<body>
  <h1>第 2 话 夜班交接</h1>
  <div id="content">
    <p>凌晨四点，来接班的是个穿校服的女孩。</p>
    <p>老太太把围裙解下来，叠好，放在柜台上。她说，我退休了。</p>
    <p>女孩看了看我，说，你今天来得正好。</p>
    <p>“为什么？”我问。</p>
    <p>她说，因为从今天起，这里卖的东西，都能实现一个愿望。但是要拿同样重要的东西来换。</p>
  </div>
