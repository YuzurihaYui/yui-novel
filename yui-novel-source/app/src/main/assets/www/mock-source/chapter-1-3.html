  <style>

<body>
  <h1>第 3 话 归还日</h1>
  <div id="content">
    <p>她最后一次来，是图书馆要闭馆改造的前一天。</p>
    <p>她把所有的书都还了，包括那本封面空白的。</p>
    <p>“以后还能见面吗？”我问。</p>
    <p>她笑了笑，说，书还在，就能。</p>
    <p>我送她到门口，回头的时候，最后一排的灯灭了。</p>
    <p>借书卡上，她的名字淡成了一片空白。只有我的名字还在，旁边多了一行小字：管理员，今天也来过。</p>
  </div>
</body>
