<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>示例书源 · 搜索</title>
  <style>
    body { margin: 0; padding: 24px 18px; background: #0d1015; color: #e9e5de; font-family: system-ui, sans-serif; }
    h1 { font-size: 18px; letter-spacing: .08em; }
    .keyword { color: #d98b96; }
    .book-list { display: grid; gap: 14px; margin-top: 18px; }
    .book-item { display: block; padding: 14px; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; color: inherit; text-decoration: none; overflow: hidden; }
    .book-cover { float: left; width: 64px; height: 86px; margin-right: 14px; border-radius: 6px; }
    .book-name { margin: 0 0 6px; font-size: 16px; }
    .book-author { color: #d98b96; font-size: 12px; }
    .book-intro { margin: 8px 0 6px; color: #a7a29b; font-size: 12px; line-height: 1.7; }
    .book-kind, .book-last { display: inline-block; margin-right: 10px; font-size: 11px; color: #6d6862; }
  </style>
</head>
<body>
  <h1>搜索结果 · <span class="keyword">轻小说</span></h1>
  <div class="book-list">
    <a class="book-item" href="book-1.html">
      <img class="book-cover" src="cover-1.svg" alt="" />
      <h3 class="book-name">星屑图书馆</h3>
      <span class="book-author">月岛灯</span>
      <p class="book-intro">闭馆之后，书架之间会长出一条没有尽头的走廊。走廊尽头有一盏灯，灯下坐着一个正在等书的人。</p>
      <span class="book-kind">奇幻</span>
      <span class="book-last">第 3 话 归还日</span>
    </a>
    <a class="book-item" href="book-2.html">
      <img class="book-cover" src="cover-2.svg" alt="" />
      <h3 class="book-name">纸上航海日志</h3>
      <span class="book-author">宵星</span>
      <p class="book-intro">一艘用稿纸折成的船，在墨水变成的海上航行。船长是一只不会说话的钢笔。</p>
      <span class="book-kind">科幻</span>
      <span class="book-last">第 2 话 无风带</span>
    </a>
    <a class="book-item" href="book-3.html">
      <img class="book-cover" src="cover-3.svg" alt="" />
      <h3 class="book-name">魔女的便利店</h3>
      <span class="book-author">柚木澪</span>
      <p class="book-intro">街角的便利店只在午夜开门，店员是退休的魔女。她卖的东西都很普通，只是保质期有点长。</p>
      <span class="book-kind">奇幻</span>
      <span class="book-last">第 2 话 夜班交接</span>
    </a>
  </div>
</body>
</html>
