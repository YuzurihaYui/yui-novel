  <title>第 2 话 无风带</title>
  <style>
    body { margin: 0; padding: 26px 20px 60px; background: #0d1015; color: #d8d4cd; font-family: Georgia, "Songti SC", serif; line-height: 2; font-size: 17px; }
    p { margin: 0 0 1.1em; text-indent: 2em; }
    h1 { font-size: 20px; color: #e9e5de; }
  </style>
</head>
<body>
  <h1>第 2 话 无风带</h1>
  <div id="content">
    <p>第三天，海面安静得像一张没有写字的纸。</p>
    <p>船停在无风带，我们哪儿也去不了。</p>
    <p>钢笔的墨水快用完了。它写完最后一行字，笔尖开始发白。</p>
    <p>我把手指咬破，挤了一滴血在墨囊里。</p>
    <p>船重新动了起来。海面上浮出一行新的字：你为什么要帮我。</p>
    <p>我说，因为我想知道尽头有什么。</p>
  </div>
</body>
</html>
